# Copy this file to config.ini, beside the agent, and fill in the server section.

[device]
# From the device: Menu > Comm. > Ethernet (IP Address, TCP COMM.Port) and Comm. > PC Connection.
ip = 192.168.0.201
port = 4370
comm_key = 0

[server]
# Both values are shown in Kiddiewise under Attendance > Settings when the device is added.
url = https://YOUR-SITE/api/attendance-device/scans
key = PASTE-THE-DEVICE-KEY-HERE

[agent]
# live: scans reach parents within seconds, but the agent holds the device's connection.
# poll: connects every poll_seconds and lets go in between, if ZKTime must stay able to connect.
mode = live
poll_seconds = 60
